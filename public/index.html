<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office AI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202d;
      --muted: #687386;
      --line: #dfe4eb;
      --paper: #ffffff;
      --canvas: #f3f5f8;
      --accent: #2356d8;
      --accent-dark: #1842ad;
      --user: #e8eefc;
      --shadow: 0 18px 55px rgba(32, 45, 70, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, rgba(35, 86, 216, .08), transparent 30%),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    .shell {
      width: min(920px, calc(100% - 32px));
      height: min(820px, calc(100vh - 48px));
      min-height: 560px;
      margin: 24px auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(210, 217, 227, .9);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--ink);
      color: white;
      font-weight: 750;
      letter-spacing: -.04em;
    }
    h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .badge {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    #messages {
      overflow-y: auto;
      padding: 30px clamp(18px, 5vw, 54px);
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 560px;
      margin: 10vh auto 0;
      text-align: center;
    }
    .welcome h2 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.04em; }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
    .suggestions button { padding: 9px 12px; border: 1px solid #dce2eb; border-radius: 999px; background: white; color: #4d5c73; font-size: 12px; }
    .suggestions button:hover { border-color: #9db3ea; color: var(--accent-dark); background: #f8faff; }

    .message { display: flex; margin: 0 0 22px; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: min(78%, 620px);
      padding: 13px 16px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
      font-size: 14px;
    }
    .assistant .bubble { background: #f5f6f8; border: 1px solid #e9ecf0; border-top-left-radius: 5px; }
    .user .bubble { background: var(--user); color: #163a91; border-top-right-radius: 5px; }
    .thinking .bubble { color: var(--muted); }

    .composer-wrap { padding: 14px 18px 18px; border-top: 1px solid var(--line); }
    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto;
      padding: 7px 7px 7px 16px;
      border: 1px solid #cfd6e0;
      border-radius: 17px;
      background: white;
      box-shadow: 0 7px 22px rgba(33, 44, 65, .07);
    }
    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 160px;
      padding: 10px 0 6px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--ink);
      font: inherit;
      line-height: 1.45;
    }
    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }
    #send {
      min-width: 76px;
      height: 42px;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-weight: 650;
    }
    #send:hover { background: var(--accent-dark); }
    #send:disabled { opacity: .55; cursor: wait; }
    #reset {
      background: transparent;
      color: var(--muted);
      padding: 7px 4px;
      font-size: 12px;
    }
    #reset:hover { color: var(--ink); }
    .footer-row {
      max-width: 760px;
      margin: 8px auto 0;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .shell { width: 100%; height: 100vh; min-height: 100vh; margin: 0; border: 0; border-radius: 0; }
      header { padding: 16px; }
      .badge { display: none; }
      #messages { padding: 22px 16px; }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark">AI</div>
        <div>
          <h1>Office AI</h1>
          <div class="subtitle">오늘 하루를 천천히 돌아보는 시간</div>
        </div>
      </div>
      <div class="badge">GPT-5.6 Luna</div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>오늘 하루는 어땠나요?</h2>
        <p>잠시 멈추어 오늘의 마음과 순간을 돌아보세요.<br>당신의 이야기를 따뜻하게 듣고, 다음 질문을 건넵니다.</p>
        <div class="suggestions">
          <button type="button" data-prompt="오늘 하루 중 가장 오래 마음에 남은 순간은 무엇이었나요?">마음에 남은 순간</button>
          <button type="button" data-prompt="오늘 내가 잘 해낸 일 하나를 함께 찾아줘.">잘 해낸 일</button>
          <button type="button" data-prompt="오늘의 나에게 따뜻한 질문 하나를 건네줘.">따뜻한 질문</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <form id="chat-form">
        <textarea id="prompt" rows="1" maxlength="10000" placeholder="메시지를 입력하세요" aria-label="메시지"></textarea>
        <button id="send" type="submit">전송</button>
      </form>
      <div class="footer-row">
        <span>Enter 전송 · Shift+Enter 줄바꿈</span>
        <button id="reset" type="button">대화 초기화</button>
      </div>
    </div>
  </main>

  <script>
    const form = document.querySelector('#chat-form');
    const prompt = document.querySelector('#prompt');
    const messages = document.querySelector('#messages');
    const send = document.querySelector('#send');
    const reset = document.querySelector('#reset');
    let previousResponseId = null;

    function addMessage(role, text, extraClass = '') {
      document.querySelector('#welcome')?.remove();
      const row = document.createElement('div');
      row.className = `message ${role} ${extraClass}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return row;
    }

    function resizePrompt() {
      prompt.style.height = 'auto';
      prompt.style.height = `${Math.min(prompt.scrollHeight, 160)}px`;
    }

    prompt.addEventListener('input', resizePrompt);
    prompt.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = prompt.value.trim();
      if (!message || send.disabled) return;

      addMessage('user', message);
      prompt.value = '';
      resizePrompt();
      send.disabled = true;
      const thinking = addMessage('assistant', '답변을 작성하고 있습니다…', 'thinking');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, previous_response_id: previousResponseId })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '요청 처리에 실패했습니다.');

        thinking.remove();
        addMessage('assistant', data.answer);
        previousResponseId = data.response_id;
      } catch (error) {
        thinking.remove();
        addMessage('assistant', `오류: ${error.message}`);
      } finally {
        send.disabled = false;
        prompt.focus();
      }
    });

    reset.addEventListener('click', () => {
      previousResponseId = null;
      messages.replaceChildren();
      const welcome = document.createElement('div');
      welcome.className = 'welcome';
      welcome.id = 'welcome';
      welcome.innerHTML = '<h2>새 대화를 시작합니다.</h2><p>이전 대화 문맥이 초기화되었습니다.</p>';
      messages.appendChild(welcome);
      prompt.focus();
    });

    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => {
        prompt.value = button.dataset.prompt;
        resizePrompt();
        prompt.focus();
      });
    });

    prompt.focus();
  </script>
</body>
</html>
